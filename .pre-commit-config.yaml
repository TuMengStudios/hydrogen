fail_fast: false
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.3.0
    hooks:
      - id: check-byte-order-marker
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
  - repo: https://github.com/psf/black
    rev: 22.10.0
    hooks:
      - id: black
  - repo: local
    hooks:
      - id: block-commit-on-master
        name: Block commits on master/main
        description: Prevent direct commits to protected branches (master/main).
        entry: python scripts/check_branch.py
        language: system
        always_run: true
        pass_filenames: false
      - id: cargo-fmt
        name: cargo fmt
        description: Format files with rustfmt.
        entry: cargo fmt --all -- --check
        language: system
        files: '(\.rs$|(^|/)(Cargo\.toml|\.?rustfmt\.toml)$)'
        pass_filenames: false
      - id: cargo-deny
        name: cargo deny check
        description: Check cargo dependencies.
        entry: cargo deny check
        language: system
        files: '(\.rs$|(^|/)(Cargo\.(toml|lock)|deny\.toml)$)'
        pass_filenames: false
      - id: typos
        name: typos
        description: check typo
        entry: typos
        language: system
        pass_filenames: false
      - id: cargo-check
        name: cargo check
        description: Check the package for errors.
        entry: cargo check --workspace --all-targets --all-features
        language: system
        files: '(\.rs$|(^|/)Cargo\.(toml|lock)$)'
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        description: Lint rust sources
        entry: cargo clippy --workspace --all-targets --all-features -- -D warnings
        language: system
        files: '(\.rs$|(^|/)Cargo\.(toml|lock)$)'
        pass_filenames: false
      - id: cargo-test
        name: cargo test
        description: unit test for the project
        entry: cargo nextest run --workspace --all-features
        language: system
        files: '(\.rs$|(^|/)Cargo\.(toml|lock)$)'
        pass_filenames: false
      - id: commitlint
        name: commitlint
        description: Lint git commit messages.
        entry: commitlint lint --config .commitlint.yaml --message
        language: system
        stages: [commit-msg]
        pass_filenames: true
        always_run: true
